
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SCoC Monitoring | NEU Marine Analytics
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            background: #17365d;
            color: white;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
        }

        .brand small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.75;
            margin-top: 4px;
        }

        .module-title {
            font-size: 14px;
            opacity: 0.9;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navigation {
            background: white;
            border-bottom: 1px solid #d9e2ec;
            padding: 0 32px;
            display: flex;
            gap: 28px;
        }

        .navigation a {
            text-decoration: none;
            color: #486581;
            padding: 15px 0;
            font-size: 14px;
            font-weight: 600;
        }

        .navigation a:hover {
            color: #17365d;
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            max-width: 1250px;
            margin: 0 auto;
            padding: 35px 25px 60px;
        }

        .page-title {
            margin-bottom: 5px;
            font-size: 28px;
            font-weight: 700;
        }

        .page-subtitle {
            color: #627d98;
            margin-bottom: 30px;
        }

        /* =====================================================
           CARDS
        ===================================================== */

        .cards {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .card {
            background: white;
            border: 1px solid #d9e2ec;
            border-radius: 12px;
            padding: 25px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.04);
        }

        .card.clickable {
            cursor: pointer;
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .card.clickable:hover {
            transform: translateY(-2px);
            box-shadow:
                0 7px 20px rgba(0,0,0,0.08);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 18px;
        }

        .metric {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
        }

        .metric-label {
            font-size: 12px;
            color: #627d98;
            margin-bottom: 7px;
        }

        .metric-value {
            font-size: 23px;
            font-weight: 700;
        }

        .target {
            color: #486581;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            display: inline-block;
            margin-top: 22px;
            padding: 8px 13px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .status-achieved {
            background: #e3fcef;
            color: #087f5b;
        }

        .status-not {
            background: #fff3bf;
            color: #8a6116;
        }

        /* =====================================================
           TABLE
        ===================================================== */

        .table-card {
            background: white;
            border: 1px solid #d9e2ec;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            background: #f8fafc;
            color: #627d98;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 14px 16px;
            border-bottom: 1px solid #d9e2ec;
        }

        td {
            padding: 15px 16px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .row-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .button {
            display: inline-block;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
            background: #17365d;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .button:hover {
            background: #1f4e78;
        }

        .back {
            margin-bottom: 22px;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            text-align: center;
            color: #829ab1;
            font-size: 12px;
            padding: 25px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 16px 20px;
            }

            .navigation {
                padding: 0 20px;
            }

            .content {
                padding: 25px 15px;
            }

            .metric-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <header class="header">

        <div class="brand">
            ⚓ NEU Marine Analytics

            <small>
                Marine Performance Platform
            </small>
        </div>

        <div class="module-title">
            SCoC Monitoring
        </div>

    </header>


    <nav class="navigation">

        <a href="/scoc/">
            Overview
        </a>

        <a href="/scoc/upload/">
            Upload Excel
        </a>

        <a href="/core/">
            Main Platform
        </a>

    </nav>


    <main class="content">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">
        NEU Marine Analytics Platform · SCoC Monitoring
    </footer>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
