{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | RightShip Inspection Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
        }

        .login-card{
            width:420px;
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .login-header{
            background:#0d6efd;
            color:#fff;
            padding:25px;
            text-align:center;
            border-radius:15px 15px 0 0;
        }

        .logo{
            font-size:55px;
            margin-bottom:10px;
        }

        .card-body{
            padding:35px;
        }

        .form-control{
            height:48px;
        }

        .btn-login{
            height:48px;
            font-weight:600;
        }

        .footer{
            text-align:center;
            color:#888;
            font-size:13px;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="card login-card">

    <div class="login-header">

        <div class="logo">
            <i class="bi bi-shield-check"></i>
        </div>

        <h4 class="mb-1">
            RightShip Inspection
        </h4>

        <small>
            Management System
        </small>

    </div>

    <div class="card-body">

        {% if form.errors %}

        <div class="alert alert-danger">

            Invalid username or password.

        </div>

        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter Username"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100 btn-login">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

        <div class="footer">

            © {% now "Y" %} RightShip Inspection Management System

        </div>

    </div>

</div>

</body>

</html>
