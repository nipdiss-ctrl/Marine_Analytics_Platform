{% extends "base_rightship.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h3 class="mb-1">
            Add Vessel
        </h3>

        <p class="text-muted mb-0">
            Create a new vessel.
        </p>

    </div>

    <a href="{% url 'vessel_list' %}" class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>

        Back

    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    {{ form.vessel_name.label }}

                </label>

                {{ form.vessel_name }}

                {% if form.vessel_name.errors %}

                    <div class="text-danger small">

                        {{ form.vessel_name.errors }}

                    </div>

                {% endif %}

            </div>

            <div class="form-check mb-4">

                {{ form.active }}

                <label class="form-check-label" for="{{ form.active.id_for_label }}">

                    {{ form.active.label }}

                </label>

            </div>

            <hr>

            <button type="submit" class="btn btn-primary">

                <i class="bi bi-save"></i>

                Save Vessel

            </button>

            <a href="{% url 'vessel_list' %}" class="btn btn-outline-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
