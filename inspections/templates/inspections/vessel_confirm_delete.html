{% extends "base_rightship.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-danger">

            <div class="card-header bg-danger text-white">

                <h4 class="mb-0">

                    Delete Vessel

                </h4>

            </div>

            <div class="card-body">

                <p class="mb-4">

                    Are you sure you want to delete the following vessel?

                </p>

                <table class="table table-bordered">

                    <tr>

                        <th width="35%">Vessel Name</th>

                        <td>{{ vessel.vessel_name }}</td>

                    </tr>

                    <tr>

                        <th>Status</th>

                        <td>

                            {% if vessel.active %}
                                Active
                            {% else %}
                                Inactive
                            {% endif %}

                        </td>

                    </tr>

                </table>

                <form method="post">

                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">

                        <i class="bi bi-trash"></i>

                        Delete

                    </button>

                    <a href="{% url 'vessel_list' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
