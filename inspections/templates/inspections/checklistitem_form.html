{% extends "base_rightship.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="fas fa-plus-circle"></i>
                New Checklist Item
            </h4>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Reference Number
                    </label>
                    {{ form.ref_no }}
                    {{ form.ref_no.errors }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Inspected Item
                    </label>
                    {{ form.inspected_item }}
                    {{ form.inspected_item.errors }}
                </div>

                <div class="text-end">

                    <a href="{% url 'checklistitem_list' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                    <button class="btn btn-success">
                        <i class="fas fa-save"></i>
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
